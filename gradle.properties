## Gradle
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

## Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.230
neo_version_range=[21.1.230,)
loader_version_range=[4,)
java_version=21
# Maven-format directory holding the NeoForge artifacts, used because this machine cannot reach
# maven.neoforged.net. Empty = network repository only.
neoforge_local_mirror=../ForestryCE/build/local-m2

# Parchment parameter mappings (same pair ForestryCE builds with, so the cache is already warm).
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## Required dependency: Forestry: Community Edition 3.0.0-alpha9 (installed in Maven Local)
forestry_group=thedarkcolour.forestry
forestry_artifact=forestry-1.21.1
forestry_version=3.0.0-alpha9
forestry_version_range=[3.0.0-alpha8,)
# Separate mod jars, development runtime only (farms has no alpha9 build yet).
forestry_optional_modules=mail,butterflies
# Forestry requires Patchouli at runtime.
patchouli_version=1.21.1-93-NEOFORGE
patchouli_version_range=[1.21.1-92,)

## Required dependency: Sable
# 2.0.6 is the current release. The jar JarJars its own libraries (sable-companion, the Rapier
# natives and Veil), so no further runtime dependencies are needed.
sable_version=2.0.6
sable_version_range=[2.0.0,)
# Compile-time only: the companion library is JarJar'd inside the Sable jar, so it never has to be
# resolved at runtime.
sable_companion_version=1.6.0

## Verification-only dependency: the generic "Sable Fix Mod"
# Set with_sable_fix=false to run the same GameTest against unpatched Sable (baseline).
with_sable_fix=true
sable_fix_mod_jar=libs/sable_fix_mod-1.1.0.jar

## Mod properties
mod_id=forestry_sable_compat
mod_name=Forestry Sable Compat
mod_group_id=com.zhichaoxi.forestrysablecompat
mod_version=0.1.0
mod_authors=
mod_description=Fixes Forestry: Community Edition blocks losing or duplicating their contents when Sable physicalizes or de-physicalizes them.
mod_license=LGPL-3.0
